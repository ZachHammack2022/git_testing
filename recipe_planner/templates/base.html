<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Meal Planner{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.svg') }}">
  <meta name="theme-color" content="#2f7d4f">
</head>
<body>
<header class="top">
  <nav>
    <a class="brand" href="{{ url_for('home') }}">🥕 Meal Planner</a>
    {% set ep = request.endpoint or '' %}
    <a href="{{ url_for('home') }}" class="{{ 'active' if ep == 'home' }}">This week</a>
    <a href="{{ url_for('recipes') }}" class="{{ 'active' if 'recipe' in ep }}">Recipes</a>
    <a href="{{ url_for('kitchen') }}" class="{{ 'active' if 'kitchen' in ep }}">Kitchen</a>
    <a href="{{ url_for('history') }}" class="{{ 'active' if ep == 'history' }}">History</a>
    <a href="{{ url_for('settings') }}" class="{{ 'active' if ep == 'settings' }}">Settings</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
